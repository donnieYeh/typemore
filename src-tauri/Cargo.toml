[package]
name = "typemore"
version = "0.1.0"
edition = "2021"

[lib]
name = "typemore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.4"
anyhow = "1.0"
once_cell = "1.19"
regex = "1.10"
cpal = "0.15"
dirs = "6.0"
enigo = "0.1"
hound = "3.5"
parking_lot = "0.12"
pinyin = "0.11"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
thiserror = "2.0"
tokio = { version = "1.42", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
uiautomation = "0.24"
uuid = { version = "1.11", features = ["v4"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
zip = "2.4"
